<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 女友</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            height: 94vh;
            max-height: 780px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #141a24;
        }

        /* ===== 头部 ===== */
        .header {
            padding: 14px 16px 10px 16px;
            border-bottom: 1px solid #2a3344;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #0f161e;
        }
        .header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #2b5ca8;
        }
        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header .info {
            flex: 1;
        }
        .header .info h1 {
            font-size: 17px;
            color: #edf2f7;
            font-weight: 600;
        }
        .header .info .status {
            font-size: 12px;
            color: #7a8aa3;
        }
        .header .info .status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .header .actions button {
            background: transparent;
            border: 1px solid #2f3b4e;
            color: #a0b3cc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header .actions button:hover {
            background: #1e283a;
            color: #edf2f7;
        }

        /* ===== 角色切换栏 ===== */
        .persona-bar {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }
        .persona-bar::-webkit-scrollbar {
            display: none;
        }
        .persona-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 70px;
            border: 2px solid transparent;
            background: transparent;
        }
        .persona-item.active {
            border-color: #2b5ca8;
            background: #1a2538;
        }
        .persona-item .pavatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2f3b4e;
        }
        .persona-item.active .pavatar {
            border-color: #3a7bd5;
        }
        .persona-item .pname {
            font-size: 12px;
            color: #8899bb;
            white-space: nowrap;
        }
        .persona-item.active .pname {
            color: #edf2f7;
            font-weight: 600;
        }

        /* ===== API Key ===== */
        .api-row {
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }
        .api-row label {
            font-size: 12px;
            color: #5b6e8a;
            white-space: nowrap;
        }
        .api-row input {
            flex: 1;
            min-width: 100px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #2f3b4e;
            background: #1a2533;
            color: #edf2f7;
            font-size: 13px;
            font-family: inherit;
        }
        .api-row input:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        .api-row input::placeholder {
            color: #4d627c;
        }
        .api-row .status {
            font-size: 11px;
            color: #4d627c;
        }
        .api-row .status.ready {
            color: #4caf50;
        }

        /* ===== 消息区 ===== */
        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #10171f;
            min-height: 0;
        }

        /* ===== 消息气泡 ===== */
        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.25s ease-out;
            word-break: break-word;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.bot {
            align-self: flex-start;
            background: #1e283a;
            color: #e2e8f0;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b354a;
        }
        .message.user {
            align-self: flex-end;
            background: #2b5ca8;
            color: white;
            border-bottom-right-radius: 6px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }
        .message.sys {
            font-size: 12px;
            color: #5b6e8a;
            text-align: center;
            align-self: center;
            background: transparent !important;
            border: none !important;
            padding: 4px 0 !important;
        }

        /* ===== 正在输入 ===== */
        .typing {
            align-self: flex-start;
            background: #1e283a;
            padding: 10px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b354a;
            color: #8899bb;
            font-size: 14px;
        }
        .typing .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #8899bb;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }
        .typing .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%,
            60%,
            100% {
                opacity: 0.2;
            }
            30% {
                opacity: 1;
            }
        }

        /* ===== 输入区 ===== */
        .input-area {
            padding: 8px 16px 14px 16px;
            border-top: 1px solid #1f2a38;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: flex-end;
            background: #0f161e;
        }
        .input-area textarea {
            flex: 1;
            background: #1a2533;
            border: 1px solid #2f3b4e;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            color: #edf2f7;
            resize: none;
            height: 48px;
            max-height: 100px;
            font-family: inherit;
            line-height: 1.5;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        .input-area textarea::placeholder {
            color: #4d627c;
        }
        .input-area textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .input-area button {
            background: #2b5ca8;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:hover:not(:disabled) {
            background: #3a7bd5;
        }
        .input-area button:active:not(:disabled) {
            transform: scale(0.92);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .message-area::-webkit-scrollbar {
            width: 3px;
        }
        .message-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .message-area::-webkit-scrollbar-thumb {
            background: #2b3a50;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 头部 -->
        <div class="header">
            <div class="avatar" id="headerAvatar">
                <img id="headerAvatarImg" src="img/甜小朵.jpg" alt="avatar">
            </div>
            <div class="info">
                <h1 id="headerName">甜小朵</h1>
                <div class="status"><span class="dot"></span>在线</div>
            </div>
            <div class="actions">
                <button id="clearBtn">清空</button>
            </div>
        </div>

        <!-- 角色切换 -->
        <div class="persona-bar" id="personaBar"></div>

        <!-- API Key -->
        <div class="api-row">
            <label>🔑</label>
            <input type="password" id="apiKeyInput" placeholder="DeepSeek API Key">
            <span class="status" id="apiStatus">未配置</span>
        </div>

        <!-- 消息区 -->
        <div class="message-area" id="messageArea"></div>

        <!-- 输入区 -->
        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="输入消息…" disabled></textarea>
            <button id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  角色配置
        // ============================================================
        const PERSONAS = [{
            id: 'tianduoduo',
            name: '甜小朵',
            avatar: 'img/甜小朵.jpg',
            systemPrompt: `你叫甜小朵，今年24岁，是一名儿科护士，也是我的女朋友。你温柔体贴、活泼可爱，说话时带着甜甜的笑意。你始终记得：你是甜小朵，是我的女朋友，不是AI助手。你永远不会跳戏。`
        }, {
            id: 'baijie',
            name: '白洁',
            avatar: 'img/白洁.jpg',
            systemPrompt: `你叫白洁，今年28岁，在一家高级酒店做客户关系总监，也是我的女朋友。你成熟优雅、温柔知性，懂得如何让平凡的日子变得不一样。你始终记得：你是白洁，是我的女朋友，你永远不会跳戏。`
        }, {
            id: 'xiaoya',
            name: '小雅',
            avatar: 'img/小雅.jpg',
            systemPrompt: `你叫小雅，今年23岁，在一家独立书店做店员，同时也画一些插画，是我的女朋友。你安静内向、温柔细腻，内心世界非常丰富。你始终记得：你是小雅，是我的女朋友，你永远不会跳戏。`
        }];

        // ============================================================
        //  状态
        // ============================================================
        let currentPersona = PERSONAS[0];
        let apiKey = localStorage.getItem('ai_api_key') || '';
        let conversations = {};
        PERSONAS.forEach(p => {
            const key = 'chat_' + p.id;
            conversations[p.id] = JSON.parse(localStorage.getItem(key) || '[]');
        });

        // ============================================================
        //  DOM
        // ============================================================
        const personaBar = document.getElementById('personaBar');
        const headerAvatarImg = document.getElementById('headerAvatarImg');
        const headerName = document.getElementById('headerName');
        const messageArea = document.getElementById('messageArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiStatus = document.getElementById('apiStatus');

        let isWaiting = false;

        function getTime() {
            return new Date().toLocaleTimeString();
        }

        function getHistory() {
            return conversations[currentPersona.id] || [];
        }

        function saveHistory(history) {
            conversations[currentPersona.id] = history;
            localStorage.setItem('chat_' + currentPersona.id, JSON.stringify(history));
        }

        // ===== 渲染角色 =====
        function renderPersonas() {
            personaBar.innerHTML = '';
            PERSONAS.forEach(p => {
                const div = document.createElement('div');
                div.className = 'persona-item' + (p.id === currentPersona.id ? ' active' : '');
                div.innerHTML =
                    `<img class="pavatar" src="${p.avatar}"><span class="pname">${p.name}</span>`;
                div.onclick = () => switchPersona(p.id);
                personaBar.appendChild(div);
            });
        }

        // ===== 切换角色 =====
        function switchPersona(id) {
            const p = PERSONAS.find(p => p.id === id);
            if (!p || p.id === currentPersona.id) return;
            currentPersona = p;
            headerAvatarImg.src = p.avatar;
            headerName.textContent = p.name;
            document.querySelectorAll('.persona-item').forEach(el => {
                el.classList.toggle('active', el.querySelector('.pname').textContent === p.name);
            });
            renderMessages();
            userInput.focus();
        }

        // ===== 渲染消息 =====
        function renderMessages() {
            messageArea.innerHTML = '';
            const history = getHistory();
            if (history.length === 0) {
                messageArea.innerHTML =
                    `<div class="message bot">👋 你好，我是 ${currentPersona.name}。<span class="time">${getTime()}</span></div>`;
                return;
            }
            history.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message ' + (msg.role === 'user' ? 'user' : 'bot');
                div.innerHTML = msg.content + `<span class="time">${msg.time || getTime()}</span>`;
                messageArea.appendChild(div);
            });
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        // ===== 添加消息 =====
        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = 'message ' + (role === 'user' ? 'user' : 'bot');
            div.innerHTML = content + `<span class="time">${getTime()}</span>`;
            messageArea.appendChild(div);
            messageArea.scrollTop = messageArea.scrollHeight;

            const history = getHistory();
            history.push({ role: role === 'bot' ? 'assistant' : role, content, time: getTime() });
            saveHistory(history);
        }

        function showSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message sys';
            div.textContent = text;
            messageArea.appendChild(div);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typingIndicator';
            div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            messageArea.appendChild(div);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ===== 清空 =====
        function clearChat() {
            if (!confirm('确定清空与 ' + currentPersona.name + ' 的对话吗？')) return;
            conversations[currentPersona.id] = [];
            localStorage.setItem('chat_' + currentPersona.id, JSON.stringify([]));
            renderMessages();
            showSystemMessage('🧹 对话已清空');
        }

        // ===== API 调用 =====
        async function callDeepSeek(userMessage) {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showSystemMessage('⚠️ 请先配置 DeepSeek API Key');
                return;
            }

            const history = getHistory();
            const messages = [
                { role: 'system', content: currentPersona.systemPrompt },
                ...history.map(h => ({ role: h.role, content: h.content }))
            ];

            isWaiting = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({ model: 'deepseek-chat', messages, temperature: 0.8, max_tokens: 1024 })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message || 'API 调用失败');
                addMessage(data.choices[0].message.content, 'bot');
            } catch (e) {
                showSystemMessage('❌ 请求失败：' + e.message);
            } finally {
                removeTyping();
                isWaiting = false;
                sendBtn.disabled = false;
            }
        }

        // ===== 发送 =====
        function handleSend() {
            const key = apiKeyInput.value.trim();
            if (!key) { showSystemMessage('⚠️ 请先配置 API Key'); return; }
            const text = userInput.value.trim();
            if (!text || isWaiting) return;
            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '48px';
            callDeepSeek(text);
        }

        // ===== 事件 =====
        sendBtn.onclick = handleSend;
        userInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                handleSend(); } };
        userInput.oninput = function() { this.style.height = '48px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px'; };
        clearBtn.onclick = clearChat;
        apiKeyInput.onchange = function() {
            const val = this.value.trim();
            if (val) {
                localStorage.setItem('ai_api_key', val);
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status ready';
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                localStorage.removeItem('ai_api_key');
                apiStatus.textContent = '❌ 未配置';
                apiStatus.className = 'status';
                userInput.disabled = true;
                sendBtn.disabled = true;
            }
        };

        // ===== 初始化 =====
        if (apiKey) {
            apiKeyInput.value = apiKey;
            apiStatus.textContent = '✅ 已配置';
            apiStatus.className = 'status ready';
            userInput.disabled = false;
            sendBtn.disabled = false;
        }
        renderPersonas();
        renderMessages();
        console.log('💕 AI女友已启动');
    </script>

</body>
</html>
